# Keeps the pinned CI actions and dev tooling current. corrobo has no runtime dependencies,
# so these are all development-time updates; each one goes through a normal PR with CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /examples/dbos-workflow
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
